paths:
  input_file: &study_file C:/Users/Brandyn/Downloads/fishery_survey_tsl.xlsx
  out_root: outputs_swfscfish
  cache_dir: cache
  supplemental_dir: &support_folder C:/Users/Brandyn/Downloads/
  azores_file: &azores_file C:/Users/Brandyn/Downloads/Azores_FishTraits_2023.tab
  mstraits_file: &mstraits_file C:/Users/Brandyn/Downloads/marineSpeciesTraits.RData
  continental_file: &continental_file C:/Users/Brandyn/Downloads/TraitCollectionFishNAtlanticNEPacificContShelf.xlsx
  log_file: outputs_swfscfish/tsbiomass_run.log

execution:
  strict_length_pdf: false
  run_multiplier_model: false
  write_log: false

cache:
  folder: cache
  refresh: true
  # refresh: false

data:
  - id: study_metadata
    path: *study_file
  - id: worms
  - id: fishbase
  - id: azorestraits
    path: *azores_file
  - id: mstraits
    path: *mstraits_file
  - id: continentaltraits
    path: *continental_file
  - id: pelagictraits
    alias: pelagic
    path: *support_folder
  # Built-in sources can omit `type` and `engine`; they are back-filled from
  # the recognized id or alias.
  #
  # A custom source can declare its own id plus an explicit type/engine/path.
  # Validation normalizes ids and aliases to lowercase, and cache naming keys
  # are derived from the normalized id.
  #
  # - id: custom_traits
  #   type: single_file
  #   engine: single_file
  #   path: supplemental/custom_traits.csv

candidates:
  enrich:
    precedence: [pelagic, mstraits, azorestraits, continentaltraits, fishbase, worms]
    missing_tokens: ["-9999", "unknown", "UNKNOWN"]
  prepare:
    missing_tokens: ["-9999", "unknown", "UNKNOWN"]
  anchors:
    selector:
      regional_body: SWFSC

alchemist:
  progress: true
  # Set taxonomic_distance: true to replace individual family/genus/species
  # Gower features with one continuous phylogenetic distance (rotl Tree of Life,
  # with rank-based fallback). Coherence terms are inherited from similarity:.
  taxonomic_distance: true
  # feature_type controls what pairwise features are fed to the Super Learner.
  # "gower"      - unsigned Gower distances in [0, 1] (original behavior)
  # "difference" - signed standardized differences (t_i - t_j) / sd(t);
  #                categorical traits still use Gower agreement. Preserves
  #                directionality and absolute scale.
  feature_type: difference
  # distill_workers controls parallelism for sigma dropout sensitivity.
  # Workers receive one base learner model at a time (not the full ensemble),
  # so RAM scales with one model + zeroed feature data per worker rather than
  # the full ensemble per worker. Safe to match your core count.
  distill_workers: 8
  learner:
    workers: 8
    # Explicit workflow seed keeps paired Sentinel scenarios reproducible.
    seed: 20260702
    methods: [glm_elastic, mars, rf]
    inner_folds: 3
    outcome_transform: log1p
    lambda_rule: lambda.1se
    # Reduce num_trees relative to the main metalearner: dropout sensitivity
    # rankings stabilize with fewer trees and smaller forests cut RAM substantially.
    method_settings:
      mars:
        degree: 2 # allow pairwise interactions
        penalty: 3 # recommended default GCV when degree >= 2
        pmethod: backward
      rf:
        num_trees: 300
        min_node_size: 10
        max_depth: 15
        sample_fraction: 0.6
        replace: false

similarity:
  conformal_alpha: 0.1
  progress: true
  species_traits: [body_shape, family, genus, species, trophic, ocean_basin]
  study_traits: [fao_area, season, diel, pressure_corrected, length_metric]
  coherence:
    length:
      mode: overlap
      # source controls which length columns back this dimension.
      # "best"    - study_length_min/max if present, length_minimum/maximum as fallback (default)
      # "study"   - study-level sampling range only
      # "species" - species-level biological range only
      # "both"    - compute independently for each; adds length_coherence_study +
      #             length_coherence_species as separate features
      source: both
    depth:
      mode: overlap
      # Same source options as length, applied to depth_minimum/maximum vs.
      # study_depth_min/max.
      source: both
    frequency:
      mode: overlap
      gap: 60

ordination:
  include_loadings: false
  include_centroids: false
  progress: true
  nmds_args:
    try: 10
    trymax: 20
    autotransform: false
    trace: false
  envfit_args:
    permutations: 999

policies:
  # Groups can be any arbitrary-length conjunction of supported nonnumeric
  # traits. Public aliases use `fao`, `derivation`, and `swimbladder`.
  # Use `joint` to add explicit conjunction variants beneath one root group.
  # When `joint` is present, `include_base: true` keeps the plain root group too.
  metric: [closest, unweighted_mean, weighted_mean, survey_distance, taxon_distance, species_distance, random]
  group:
    species:
      include_base: true
      metric: [closest, unweighted_mean, weighted_mean, survey_distance]
      joint: 
        - study_cell
        - fao
        - ocean_basin
        - [ocean_basin, season]
    genus:
      include_base: true
      joint: 
        - study_cell
        - fao
        - ocean_basin
        - [ocean_basin, season]
    family:
      include_base: true
      joint: 
        - study_cell
        - fao
        - ocean_basin
        - [ocean_basin, season]
    generalized:
      include_base: true
      joint: 
        - ocean_basin
        - [ocean_basin, season]
    ocean_basin:
    fao:
    study_cell:
    all:
  branch: [all, fixed_slope, free_slope]

benchmark:
  workers: 8
  engine: cpp
  include_ts_error: true
  progress: true

sentinel:
  # Aggregate headline validation: ten species-disjoint outer folds.
  # Set to 93 only for the final per-species LOSO analysis.
  baseline_species_folds: 10
  # Trait importance uses five paired grouped folds, one ablation per SIMILARITY
  # feature. Admissibility-only traits (e.g. swimbladder_type) are gates, not
  # similarity features, so they are not ablated here. With taxonomic distance
  # enabled, family/genus/species form one effective-feature ablation: nine
  # components produce 5 baseline + 45 ablation workflows.
  ablation_species_folds: 5
  # Run one outer workflow per physical core and checkpoint after each wave.
  workers: 6
  batch_size: 6
  # Sentinel scores scalar replacement error, so TS-curve reconstruction is
  # omitted from fold-local policy benchmarks.
  include_ts_error: false
  # Prevent benchmark and learner workers inside each outer process from
  # oversubscribing the six physical cores.
  throttle_inner_workers: true
  # Keep the configured NMDS schedule; this flag can independently reduce it.
  fast_validation: false
  # Console output and fold-local file logging are independent controls.
  progress: true
  logging: true
  save_case_artifacts: false

admissibility:
  species_traits: [swimbladder_type]
  study_traits: []
  coherence:
    length:
      mode: overlap
      min: 0.01
    depth:
      mode: overlap
      min: 0.01
    frequency:
      mode: overlap
      gap: 60
  key_metadata_max: 0.75
  progress: true

uncertainty:
  progress: true
  # Uncertainty-stage Super Learner (self-contained; predicts interval widths).
  method: super_learner
  super_methods:
    - glm
    - qreg_q75
    - qreg_q90
    - glm_elastic
    - rf
    - xgboost
    - qrf
    - gpr
  n_folds: 5
  inner_folds: 3
  workers: 8
  outcome_col: error_abs_log
  outcome_clip_quantile: 1
  outcome_transform: log1p
  lambda_rule: lambda.min
  loss: squared_error
  method_settings:
    qreg:
      variants:
        q75: { tau: 0.75 }
        q90: { tau: 0.90 }
    rf:
      num_trees: 500
      min_node_size: 10
      sample_fraction: 0.8
      replace: false
      respect_unordered_factors: ignore
      mtry: null
      max_depth: 15
    xgboost:
      nrounds: 500
      eta: 0.05
      max_depth: 6
      min_child_weight: 5
      subsample: 0.8
      colsample_bytree: 0.8
      lambda: 3.0
      alpha: 1.0
    # Quantile regression forest: predicts the conditional 0.9 quantile, a natural
    # upper-tail learner for interval widths.
    qrf:
      num_trees: 500
      min_node_size: 10
      sample_fraction: 0.8
      replace: false
      quantile: 0.9
    # Gaussian-process regression with a native predictive variance.
    gpr:
      var: 0.001

selection:
  one_se_multiplier: 1
  equivalence_tolerance: 0.05
  n_boot: 2000
  # uncertainty_rule:
  #   tolerance - keep widths within max(u_tol_abs, u_tol_rel * u_min)
  #   one_se    - keep widths within one standard error of the minimum width
  #   min       - keep only the strict minimum width
  uncertainty_rule: one_se
  local_distance_tolerance: 1.0e-12
  conformal_alpha: 0.1
  bin_alpha: 0.1
  min_bin_scores: 15
  use_support_bin_intervals: false
  progress: true
  # Selection-stage Super Learner (self-contained; predicts replacement error).
  method: super_learner
  # Public learner names can be plain families (`glm`, `gam`, `rpart`,
  # `rf`, `xgboost`) or named family variants exposed below.
  super_methods:
    - glm
    - lmm
    - glm_ridge
    - glm_lasso
    - glm_elastic
    - mars
    - rpart_shallow
    - rpart_deep
    - rf
    - xgboost
    - bart
    - xbart
    - wsbart
    - vfbart
    - rebart
    - knn
    - cubist
    - svr
    - gpr
  n_folds: 5
  inner_folds: 3
  workers: 8
  outcome_col: error_abs_log
  outcome_clip_quantile: 1
  outcome_transform: log1p
  lambda_rule: lambda.min
  loss: squared_error
  # Optional explicit override for the learner's score-retention band.
  # Leave unset to use the one-standard-error rule.
  # max_selection_tolerance:
  method_settings:
    lmm:
      fit_method: REML
      random_intercept: .split_group
    glm_penalized:
      standardize: true
      type_measure: mae
    mars:
      degree: 2 # enables low-order interactions
      penalty: 3 # recommended GCV when degree > 1
      pmethod: backward
    rpart:
      cp: 0.01
      minsplit: 20
      minbucket: 7
      maxdepth: 30
      variants:
        shallow:
          cp: 0.02
          minsplit: 30
          minbucket: 10
          maxdepth: 3
        deep:
          cp: 0.001
          minsplit: 10
          minbucket: 5
          maxdepth: 10
    rf:
      num_trees: 500
      mtry: null
      min_node_size: 5
      sample_fraction: 0.8
      replace: false
      respect_unordered_factors: order
      max_depth: 15
    xgboost:
      nrounds: 500
      nthread: 1
      eta: 0.05
      max_depth: 6
      min_child_weight: 5
      subsample: 0.8
      colsample_bytree: 0.8
      lambda: 2.0
      alpha: 0.5
    # BART methods (stochtree). Each public BART method owns its sampler
    # schedule/mode directly. vfbart carries the variance forest; rebart carries
    # the random-effect grouping column.
    bart:
      num_trees: 75
      num_gfr: 0
      num_burnin: 100
      num_mcmc: 200
      alpha: 0.95
      beta: 2
      min_samples_leaf: 5
      max_depth: 10
      keep_gfr: true
      variance_forest: false
      random_effects: false
    xbart:
      num_trees: 75
      num_gfr: 40
      num_burnin: 0
      num_mcmc: 0
      alpha: 0.95
      beta: 2
      min_samples_leaf: 5
      max_depth: 10
      keep_gfr: true
      variance_forest: false
      random_effects: false
    wsbart:
      num_trees: 75
      num_gfr: 20
      num_burnin: 0
      num_mcmc: 200
      alpha: 0.95
      beta: 2
      min_samples_leaf: 5
      max_depth: 10
      keep_gfr: true
      variance_forest: false
      random_effects: false
    vfbart:
      num_trees: 75
      num_gfr: 0
      num_burnin: 100
      num_mcmc: 200
      alpha: 0.95
      beta: 2
      min_samples_leaf: 5
      max_depth: 10
      keep_gfr: true
      variance_forest: true
      variance_forest_num_trees: 50
      random_effects: false
    rebart:
      num_trees: 75
      num_gfr: 0
      num_burnin: 100
      num_mcmc: 200
      alpha: 0.95
      beta: 2
      min_samples_leaf: 5
      max_depth: 10
      keep_gfr: true
      variance_forest: false
      random_effects: true
      random_effects_group: .split_group
    # k-nearest-neighbours regression (FNN::knn.reg) on the standardized feature
    # matrix.
    knn:
      k: 10
    # Cubist rule-based model (linear leaves). committees = boosting-like model
    # count; neighbors (0-9) = instance-based predict-time correction.
    cubist:
      committees: 1
      neighbors: 0
    # Support-vector regression (kernlab::ksvm, RBF; sigma auto-estimated).
    svr:
      C: 1
      epsilon: 0.1
    # Quantile regression forest (ranger); most useful in the uncertainty library.
    qrf:
      num_trees: 500
      min_node_size: 10
      sample_fraction: 1
      replace: true
      quantile: 0.9
    # Gaussian-process regression (kernlab::gausspr, RBF; sigma auto-estimated).
    gpr:
      var: 0.001

simulation:
  workers: 8
  progress: true

outputs:
  fao_distribution:
    studies: study_counts
    models: model_counts
  ordination:
    species: species_ordination
    study: study_ordination
    combined: combined_ordination
  slope_dependence:
    distribution: slope_dependence_histogram
    boxplots: slope_dependence_boxplot
    support: slope_dependence_barchart
